server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: legal-consult-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:classpath:application-local.yml
      - optional:file:./application-local.yml
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:legal-consult-system-jwt-secret-key-please-change-in-production-2026}
  expire-hours: 24

coze:
  base-url: https://api.coze.cn
  bot-id: ${COZE_BOT_ID:}
  token: ${COZE_TOKEN:}
  mock: ${COZE_MOCK:true}
  timeout-seconds: 120

app:
  cors-origins: http://localhost:5173
  file-dir: ./files

logging:
  level:
    com.legal.consult: info
